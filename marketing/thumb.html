<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0}
.c{width:1920px;height:960px;position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
 background:
  radial-gradient(900px 700px at 1480px 520px, rgba(98,112,255,.34), transparent 70%),
  radial-gradient(700px 500px at 0px 0px, rgba(143,120,255,.18), transparent 70%),
  linear-gradient(160deg,#141727 0%,#0C0E16 60%,#0A0B12 100%);}
.c::before{content:"";position:absolute;inset:0;
 background-image:radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px);background-size:28px 28px;
 -webkit-mask-image:radial-gradient(1000px 700px at 1400px 480px,#000 20%,transparent 75%)}

/* left */
.left{position:absolute;left:120px;top:0;bottom:0;width:780px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:26px;margin-bottom:34px}
.brand img{width:124px;height:124px;filter:drop-shadow(0 14px 28px rgba(60,50,200,.45))}
h1{margin:0;font-weight:800;font-size:124px;letter-spacing:-4.5px;line-height:1}
p.sub{margin:0 0 46px;font-size:42px;line-height:1.28;color:#B4BAD3;font-weight:500;letter-spacing:-.6px;max-width:740px}
p.sub b{color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:14px;max-width:760px}
.chip{display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 24px 0 18px;border-radius:29px;
 background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);font-size:25px;font-weight:600;color:#E3E6F5}
.chip svg{width:26px;height:26px;fill:none;stroke:#8FA2FF;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* windows */
.win{position:absolute;width:520px;height:360px;border-radius:16px;background:#171A26;border:1.5px solid rgba(255,255,255,.10);
 box-shadow:0 30px 60px rgba(0,0,0,.5);overflow:hidden}
.win .bar{height:46px;display:flex;align-items:center;gap:9px;padding:0 18px;background:#1E2231;border-bottom:1.5px solid rgba(255,255,255,.06);position:relative}
.win .bar i{width:13px;height:13px;border-radius:50%;background:#3A3F52}
.win .bar i:nth-child(1){background:#FF5F57}.win .bar i:nth-child(2){background:#FEBC2E}.win .bar i:nth-child(3){background:#28C840}
.win .ttl{position:absolute;left:0;right:0;text-align:center;font-size:19px;font-weight:600;color:#C9CEE3;display:flex;align-items:center;justify-content:center;gap:9px}
.win .ttl svg{width:20px;height:20px}
.win .body{display:flex;height:calc(100% - 46px)}
.win .side{width:150px;padding:18px 14px;background:#141722;border-right:1.5px solid rgba(255,255,255,.05)}
.win .side div{height:10px;border-radius:5px;background:#2D3246;margin:0 0 15px}
.win .code{flex:1;padding:20px 22px}
.win .code div{height:10px;border-radius:5px;margin:0 0 15px}
.w1{left:1310px;top:84px;filter:brightness(.62)}
.w2{left:1346px;top:196px;filter:brightness(.8)}
.w3{left:1382px;top:308px}

/* panel */
.panel{position:absolute;left:1046px;top:112px;width:430px;border-radius:20px;overflow:hidden;background:#2d2d2d;
 border:1.5px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 8px rgba(255,255,255,.03)}
.panel img{display:block;width:430px}

/* key */
.key{position:absolute;left:790px;top:606px;width:212px;height:212px;border-radius:40px;padding:14px;
 background:linear-gradient(160deg,#2A2D38,#15161C);box-shadow:0 30px 60px rgba(0,0,0,.6), inset 0 1.5px 0 rgba(255,255,255,.12)}
.key .face{width:100%;height:100%;border-radius:28px;background:#05060A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
 box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.06)}
.key .face img{width:112px;height:112px}
.key .face span{font-size:21px;font-weight:700;color:#fff;letter-spacing:.2px}
.ring{position:absolute;left:766px;top:582px;width:260px;height:260px;border-radius:56px;border:3px solid rgba(143,162,255,.55);
 box-shadow:0 0 40px rgba(110,130,255,.45)}
.ring.r2{left:744px;top:560px;width:304px;height:304px;border-radius:70px;border-color:rgba(143,162,255,.22);box-shadow:none}
.tap{position:absolute;left:1040px;top:548px;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:24px;
 background:#6A8DFF;color:#fff;font-size:22px;font-weight:700;box-shadow:0 12px 30px rgba(80,100,255,.5)}
.tap svg{width:22px;height:22px;fill:#fff}
</style></head><body>
<div class="c">
 <div class="left">
  <div class="brand"><img src="mark.svg"><h1>Open With</h1></div>
  <p class="sub">Open your project folders in <b>any app</b> with a single key press.</p>
  <div class="chips">
   <span class="chip"><svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 11v5M9.5 13.5h5"/></svg>Multiple folders per key</span>
   <span class="chip"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Any app</span>
   <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>No Terminal needed</span>
  </div>
 </div>

 <div class="win w1"><div class="bar"><i></i><i></i><i></i><div class="ttl">FOLDER api</div></div><div class="body"><div class="side">SIDE</div><div class="code">CODE</div></div></div>
 <div class="win w2"><div class="bar"><i></i><i></i><i></i><div class="ttl">FOLDER web</div></div><div class="body"><div class="side">SIDE</div><div class="code">CODE</div></div></div>
 <div class="win w3"><div class="bar"><i></i><i></i><i></i><div class="ttl">FOLDER docs</div></div><div class="body"><div class="side">SIDE</div><div class="code">CODE</div></div></div>

 <div class="panel"><img src="out/ui-en.png"></div>

 <div class="ring r2"></div><div class="ring"></div>
 <div class="key"><div class="face"><img src="editor-icon.svg"><span>acme</span></div></div>
</div>
<script>
const FOLDER='<svg viewBox="0 0 20 20"><path fill="#5aa9f5" d="M2 5.2C2 4.5 2.5 4 3.2 4h4.1l1.6 1.6h7.9c.7 0 1.2.5 1.2 1.2v8c0 .7-.5 1.2-1.2 1.2H3.2C2.5 16 2 15.5 2 14.8z"/><path fill="#8cc7ff" d="M2 7.4c0-.6.5-1 1-1h14c.6 0 1 .4 1 1v7.4c0 .7-.5 1.2-1.2 1.2H3.2C2.5 16 2 15.5 2 14.8z"/></svg>';
document.querySelectorAll('.ttl').forEach(t=>t.innerHTML=t.innerHTML.replace('FOLDER',FOLDER));
const side=[70,90,60,100,80,55,85,65];
document.querySelectorAll('.side').forEach((s,k)=>{s.innerHTML=side.map((w,i)=>`<div style="width:${w}%;margin-left:${i%3?14:0}px"></div>`).join('')});
const cols=['#C586FF','#7DD3FC','#5EEAD4','#FDBA74','#A5B4FC','#F9A8D4'];
document.querySelectorAll('.code').forEach((c,k)=>{let h='';for(let i=0;i<10;i++){const n=1+((i*7+k)%3);let x=(i%4)*22;for(let j=0;j<n;j++){const w=40+((i*31+j*17+k*13)%120);h+=`<div style="display:inline-block;width:${w}px;margin-left:${j?10:x}px;background:${cols[(i+j+k)%cols.length]};opacity:.8"></div>`;}h+='<br>';}c.innerHTML=h});
</script>
</body></html>
